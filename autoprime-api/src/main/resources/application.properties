# ==================================================================
# Configuration de l'API AutoPrime (Spring Boot)
# Anciennement application.yml — conversion en format properties.
# ==================================================================

# --- Serveur ---
server.port=8081

# --- Application ---
spring.application.name=autoprime-api

# --- Base de données SQLite (fichier local, créé automatiquement) ---
# Un déploiement = un client, une base SQLite.
# Au premier lancement, les tables sont créées automatiquement.
spring.jpa.deferred-constraint-enforcement=enabled
# "update" : crée/met à jour le schéma à chaque lancement
# Passer à "validate" (ou "none") une fois les migrations en place.
spring.jpa.hibernate.ddl-auto=update

spring.datasource.url=jdbc:sqlite:autoprime.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Nom de la base de données de ce déploiement
spring.datasource.name=autoprime

# Hibernate configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.show-sql=false

# --- CORS : autoriser le front Vite (pnpm dev / pnpm preview) ---
# 5174 : port de repli quand 5173 est déjà pris par un autre projet.
# 127.0.0.1 : le navigateur envoie cette origine quand on ouvre l'URL locale.
cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:4173,http://127.0.0.1:4173

# --- Comptes de l'espace admin ---
# Compte admin du client : créé au premier démarrage, puis stocké (haché) en base.
# Ces valeurs ne servent qu'au seed ; ensuite, changer le mot de passe depuis l'admin.
app.admin.identifiant=gerant
app.admin.mot-de-passe=ChangezMoi2026

app.auth.duree-session-heures=12

# Compte technique du mainteneur : accès aux écrans de configuration du site
# (apparence, identité, contenu, services).
app.auth.dev.identifiant=dev
app.auth.dev.mot-de-passe=AutoPrime2026Dev
app.auth.dev.nom=Développeur

# --- Identité du site (un seul client par instance) ---
app.site.nom=AutoPrime

# --- Actuator & Monitoring ---
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}

# --- Actuator Security (optionnel : sécuriser /actuator) ---
# management.endpoint.security.enabled=true

# --- Swagger / OpenAPI ---
springdoc.api.title=AutoPrime API
springdoc.api.version=1.0.0
springdoc.api.description=API REST pour la gestion véhicules, contacts, devis transit, location
springdoc.show-actuator=true
springdoc.packages-to-scan=com.autoprime