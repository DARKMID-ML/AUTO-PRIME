# ==================================================================
# Profil `test` — base H2 en mémoire (la production reste sur SQLite)
# ==================================================================

spring.datasource.url=jdbc:h2:mem:autoprime;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Les tests créent leurs propres données : DataSeeder est désactivé
# (@Profile("!test")) et aucun compte admin n'est seedé.

# Compte technique connu des tests (voir ApiTestSupport).
app.auth.dev.identifiant=dev
app.auth.dev.mot-de-passe=DevTest2026
app.auth.duree-session-heures=12
