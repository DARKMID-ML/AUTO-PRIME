# ==================================================================
#  NGINX — site AutoPrime (front Vite + API Spring Boot)
#  Installation :
#    cp deploy/nginx/autoprime.conf /etc/nginx/sites-available/autoprime
#    ln -s /etc/nginx/sites-available/autoprime /etc/nginx/sites-enabled/
#    # 1. remplacer autoprime.example.com par le vrai domaine
#    nginx -t && systemctl reload nginx
#  HTTPS :  certbot --nginx -d autoprime.example.com -d www.autoprime.example.com
# ==================================================================

# Limite les tentatives de connexion à l'espace admin (20/minute et par IP).
limit_req_zone $binary_remote_addr zone=autoprime_login:10m rate=20r/m;

server {
    listen 80;
    listen [::]:80;
    server_name autoprime.example.com www.autoprime.example.com;

    # Dossier du build Vite (contenu de autoprime-web/dist)
    root /var/www/autoprime;
    index index.html;

    # --- En-têtes de sécurité ---
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # --- Compression ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # --- Build Vite : fichiers hashés, cache long ---
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- Photos et images du site ---
    location /images/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # --- API Spring Boot (même origine : pas de CORS nécessaire) ---
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        client_max_body_size 8m;
    }

    # --- Connexion admin : limitation des essais ---
    location = /api/auth/login {
        limit_req zone=autoprime_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Site React (routage côté client) ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Interdit l'accès aux fichiers cachés ---
    location ~ /\. {
        deny all;
    }
}
