<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img" aria-label="Logo">
  <!-- ══════════════════════════════════════════════════════════════
       LOGO PLACEHOLDER — à remplacer par le logo du client.
       • Déposez le fichier du client dans `public/` (png/svg/jpg)
       • Puis mettez à jour `VITE_SITE_LOGO` (et `VITE_SITE_FAVICON`)
         dans `.env` / `.env.example`.
       ══════════════════════════════════════════════════════════════ -->

  <!-- Marque -->
  <g>
    <rect x="8" y="20" width="160" height="160" rx="40" fill="#C41E3A" />
    <path
      d="M52 118h56M44 118l14-38a14 14 0 0 1 13-9h34a14 14 0 0 1 13 9l14 38"
      fill="none"
      stroke="#ffffff"
      stroke-width="11"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <circle cx="66" cy="130" r="9" fill="#ffffff" />
    <circle cx="118" cy="130" r="9" fill="#ffffff" />
    <rect x="44" y="96" width="84" height="8" rx="4" fill="#1E3A8A" />
  </g>

  <!-- Nom de la marque (à personnaliser) -->
  <text
    x="192"
    y="128"
    font-family="Epilogue, Inter, Arial, sans-serif"
    font-size="82"
    font-weight="800"
    letter-spacing="-2"
    fill="#0F172A"
  >Auto<tspan fill="#C41E3A">Prime</tspan></text>
</svg>
